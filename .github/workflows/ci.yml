name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Rust test + release build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          uname -m

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Release build
        run: cargo build --release --target aarch64-apple-darwin

      - name: Architecture check
        run: |
          file target/aarch64-apple-darwin/release/debrief
          lipo -info target/aarch64-apple-darwin/release/debrief || true
