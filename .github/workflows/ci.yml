name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Swift test + release build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          uname -m

      - name: Resolve packages
        run: swift package resolve

      - name: Test
        run: swift test

      - name: Release build
        run: swift build -c release

      - name: Architecture check
        run: |
          file .build/release/debrief
          lipo -info .build/release/debrief || true
